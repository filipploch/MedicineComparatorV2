{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}Logowanie{% endblock %}
{% block content %}
<h1>Panel redaktora</h1>
<form method="post" class="card" style="max-width: 22rem">
  {{ csrf() }}
  <p><label>Login<br><input type="text" name="username" autocomplete="username" required></label></p>
  <p><label>Hasło<br><input type="password" name="password" autocomplete="current-password" required></label></p>
  <button>Zaloguj</button>
</form>
{% endblock %}
